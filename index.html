<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleprompter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="editor" class="view">
      <h1>Teleprompter</h1>
      <textarea id="script-input" placeholder="Cole ou digite seu roteiro aqui..."></textarea>
      <div class="editor-actions">
        <button id="start-btn" class="primary" type="button">Iniciar ▶</button>
        <button id="import-btn" type="button">📂 Importar .json</button>
        <button id="save-btn" type="button">💾 Salvar .json</button>
      </div>
      <div class="gdocs-row">
        <input type="url" id="gdocs-url" class="gdocs-url" placeholder="Cole o link do Google Docs (compartilhado por link)" autocomplete="off">
        <button id="gdocs-btn" type="button">📄 Puxar do Google Docs</button>
      </div>
      <p id="message" class="message" role="alert" aria-live="polite"></p>
      <input type="file" id="file-input" accept="application/json,.json" hidden>
    </section>

    <section id="prompter" class="view hidden">
      <div id="viewport">
        <div id="scroller">
          <div id="script-text"></div>
        </div>
      </div>
      <div id="controls">
        <button id="fullscreen-btn" type="button" title="Tela cheia" aria-label="Tela cheia">⛶</button>
        <button id="play-btn" type="button" title="Play/Pausa (espaço)" aria-label="Play/Pausa">▶</button>
        <button id="speed-dec" type="button" title="Diminuir velocidade" aria-label="Diminuir velocidade">−</button>
        <span id="speed-value" class="speed-value" title="Velocidade (px/s)" aria-live="polite">60</span>
        <button id="speed-inc" type="button" title="Aumentar velocidade" aria-label="Aumentar velocidade">+</button>
        <button id="font-dec" type="button" title="Diminuir fonte" aria-label="Diminuir fonte">A-</button>
        <button id="font-inc" type="button" title="Aumentar fonte" aria-label="Aumentar fonte">A+</button>
        <button id="rewind-btn" type="button" title="Voltar o texto" aria-label="Voltar o texto">⏪</button>
        <button id="forward-btn" type="button" title="Avançar o texto" aria-label="Avançar o texto">⏩</button>
        <button id="restart-btn" type="button" title="Reiniciar do topo" aria-label="Reiniciar do topo">⟳</button>
        <button id="mirror-h" type="button" title="Espelhar esquerda↔direita" aria-label="Espelhar horizontal">↔</button>
        <button id="mirror-v" type="button" title="Espelhar cima↕baixo" aria-label="Espelhar vertical">↕</button>
        <span class="spacer"></span>
        <button id="edit-btn" type="button" title="Voltar a editar" aria-label="Editar">✏️</button>
      </div>
      <button id="exit-immersive" type="button" title="Sair da tela cheia" aria-label="Sair da tela cheia">⤢ Sair</button>
    </section>
  </main>

  <script src="teleprompter-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
